name: MARKET isolated tests

on:
  pull_request:
    paths:
      - 'app/handlers/start.py'
      - 'app/modules/market/**'
      - 'main.py'
      - 'tests/test_market_isolated.py'
      - '.github/workflows/market-tests.yml'
  workflow_dispatch:

jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'aiogram>=3,<4' python-dotenv
      - name: Compile modified modules
        run: python -m py_compile app/handlers/start.py app/modules/market/router.py main.py tests/test_market_isolated.py
      - name: Run isolated tests without polling
        run: python -m unittest discover -s tests -p test_market_isolated.py -v
